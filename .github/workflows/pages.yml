name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: syntax check every script
        run: for f in src/*.js sw.js scripts/*.js; do node --check "$f"; done

      # script tags resolve, the service worker shell is complete, no two
      # files declare the same global — and writes .eslint-globals.json
      - name: static checks
        run: node scripts/check.js

      - name: lint
        run: npx --yes eslint@9 src sw.js scripts

      - name: icons are reproducible from source
        run: |
          node scripts/make-icons.js
          git diff --exit-code -- public/ \
            || (echo "::error::public/ icons differ from scripts/make-icons.js output" && exit 1)

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ship only what the browser asks for
      - name: assemble the site
        run: |
          mkdir -p _site
          cp index.html sw.js _site/
          cp -r src public _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
