# micro sampler — static site
# place in /etc/nginx/sites-available/sampler and symlink into sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name sampler.example.com;
    # certbot will rewrite this block to add TLS.
    # HTTPS is required: getUserMedia is blocked on plain HTTP.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sampler.example.com;

    ssl_certificate     /etc/letsencrypt/live/sampler.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sampler.example.com/privkey.pem;

    root /var/www/sampler;
    index index.html;

    # allow this page to use the microphone, deny everything else
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), interest-cohort=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # No network calls of any kind: everything the app needs is same-origin.
    # `blob:` in script-src is what lets the AudioWorklet recorder load —
    # drop it and sampling silently falls back to a ScriptProcessor.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' blob:; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Filenames are not content-hashed — there is no build step — so the
    # shell must revalidate rather than sit in the browser cache. `no-cache`
    # still allows a 304, which costs almost nothing, and it is what keeps a
    # deploy from being shadowed for days by a stale copy.
    location = /sw.js       { add_header Cache-Control "no-cache" always; }
    location = /index.html  { add_header Cache-Control "no-cache" always; }

    location ~* \.(js|css|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
    }

    # icons are referenced by name and change essentially never
    location ~* \.(png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
}
